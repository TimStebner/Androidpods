org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
# ponytail: local Gradle daemon needs a JDK the AGP toolchain supports; system default is
# JDK 25 which AGP 9.3.1 does not yet certify as a daemon JVM. Point at a locally installed
# JDK 21 instead of requiring a system-wide install/root access.
org.gradle.java.home=/home/tim/.jdks/jdk-21.0.12+8

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
